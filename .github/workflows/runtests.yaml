name: "run tests"
on:
  pull_request:
    branches:
      - main

jobs:
    test:
        permissions:
          contents: write # for schemas
          pull-requests: write
          checks: write
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
             node-version: '22'
          - name: Install Dependencies
            run: cd frontend && npm ci
          - name: test
            run: cd frontend && npx jest --ci --json --coverage --testLocationInResults --outputFile=report.json
          - name: show report
            run: cat ./frontend/report.json
          - uses: ArtiomTr/jest-coverage-report-action@v2
            with:
              working-directory: ./frontend


